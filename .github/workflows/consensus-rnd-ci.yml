name: consensus-rnd-ci

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: consensus-rnd-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-tests:
    name: contract-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reject removed runtime references
        shell: bash
        run: |
          removed_skill_dir="skills/consensus""-loop"
          removed_runtime_pattern='consensus[-]loop|consensus[-]rnd[-]cli|codex[_]refactor[_]loop|[.]refactor[-]loop'
          if test ! -e "$removed_skill_dir" && test ! -L "$removed_skill_dir"; then
            :
          else
            echo "Removed skill directory still exists: $removed_skill_dir" >&2
            exit 1
          fi
          if ! tracked_removed_files=$(git ls-files -- "$removed_skill_dir" "$removed_skill_dir/**"); then
            echo "Unable to inspect tracked files under: $removed_skill_dir" >&2
            exit 1
          fi
          if [ -n "$tracked_removed_files" ]; then
            echo "Removed skill files remain tracked:" >&2
            printf '%s\n' "$tracked_removed_files" >&2
            exit 1
          fi
          if grep -rn -E "$removed_runtime_pattern" --exclude-dir=.git --exclude=.git .; then
            echo "Removed runtime reference found" >&2
            exit 1
          else
            scan_status=$?
            [ "$scan_status" -eq 1 ] || exit "$scan_status"
          fi
          if git ls-files -s -z | while IFS= read -r -d '' index_entry; do
            index_metadata="${index_entry%%$'\t'*}"
            tracked_path="${index_entry#*$'\t'}"
            index_mode="${index_metadata%% *}"
            [ "$index_mode" = "120000" ] || continue
            object_and_stage="${index_metadata#* }"
            object_id="${object_and_stage%% *}"
            if ! link_target=$(git cat-file blob "$object_id"); then
              echo "Unable to inspect tracked symlink target: $tracked_path" >&2
              exit 1
            fi
            if printf '%s' "$link_target" | grep -Eq "$removed_runtime_pattern"; then
              echo "Tracked symlink target contains removed runtime reference: $tracked_path" >&2
              exit 1
            else
              link_scan_status=$?
              [ "$link_scan_status" -eq 1 ] || exit "$link_scan_status"
            fi
          done; then
            :
          else
            symlink_scan_status=$?
            exit "$symlink_scan_status"
          fi

      - name: Run contract tests
        run: |
          python3 -m unittest discover -s skills/sshx/tests -p 'test_*.py'

  manifest-version-sync:
    name: manifest-version-sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check manifest version sync
        run: python3 .github/scripts/bump_version.py --check

  lint-advisory:
    name: lint-advisory
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install advisory lint tools
        shell: bash
        run: |
          set +e
          python3 -m pip install --user ruff
          RUFF_INSTALL_STATUS=$?
          npm install -g markdownlint-cli2
          MARKDOWNLINT_INSTALL_STATUS=$?
          {
            echo "## lint-advisory installs"
            echo "- ruff install exit: ${RUFF_INSTALL_STATUS}"
            echo "- markdownlint-cli2 install exit: ${MARKDOWNLINT_INSTALL_STATUS}"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Run advisory linters
        shell: bash
        run: |
          set +e
          if compgen -G ".github/scripts/*.sh" > /dev/null; then shellcheck .github/scripts/*.sh; else true; fi
          SHELLCHECK_STATUS=$?
          python3 -m ruff check --select E9,F63,F7,F82 .github/scripts skills/sshx/tests
          RUFF_STATUS=$?
          markdownlint-cli2 "**/*.md" "!node_modules" "!.git"
          MARKDOWNLINT_STATUS=$?
          {
            echo "## lint-advisory results"
            echo "- shellcheck exit: ${SHELLCHECK_STATUS}"
            echo "- ruff exit: ${RUFF_STATUS}"
            echo "- markdownlint-cli2 exit: ${MARKDOWNLINT_STATUS}"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
